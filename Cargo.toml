[workspace]
members = [".", "vendor/rtk"]
default-members = [".", "vendor/rtk"]
resolver = "2"

[workspace.dependencies]
cotrex_ai_contract = { package = "contract", path = "cotrex-ai/contract" }
cotrex_ai_runtime = { package = "runtime", path = "cotrex-ai/runtime" }
cotrex_ai_kernel = { package = "kernel", path = "cotrex-ai/kernel" }

[package]
name = "cotrex"
version = "3.0.0"
edition = "2021"
authors = ["Pamod Madubashana"]
description = "CLI toolkit for optimizing AI agent performance and reducing token usage."
repository = "https://github.com/pamod-madubashana/Cotrex"
homepage = "https://github.com/pamod-madubashana/Cotrex"
documentation = "http://pamod.is-a.dev/Cotrex/"
readme = "README.md"
keywords = ["ai", "cli", "token", "optimization", "agent"]
categories = ["command-line-utilities"]
license = "MIT"

[[bin]]
name = "cotrex"
path = "src/main.rs"

[lib]
name = "cotrex"
path = "src/lib.rs"

[features]
default = ["local-model"]
local-model = ["dep:llama-cpp-provider"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
inquire = "0.7"
dirs = "5"
toml = "0.8"
markdown-to-ansi = "0.2"
glob = "0.3"
regex = "1"
indicatif = "0.17"
cotrex_ai_contract.workspace = true
cotrex_ai_runtime.workspace = true
cotrex_ai_kernel.workspace = true
thiserror = "2"
llama-cpp-provider = { path = "cotrex-ai/providers/llama-cpp", optional = true }

[dev-dependencies]
tempfile = "3"
