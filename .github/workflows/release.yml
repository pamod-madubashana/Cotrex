name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace

  build:
    needs: quality-gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install pyinstaller graphifyy
      - name: Build graphify executable
        run: python -m PyInstaller --clean --noconfirm Scripts/graphify.spec
      - name: Copy graphify to target/release
        shell: bash
        run: |
          mkdir -p target/release
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/graphify.exe target/release/graphify.exe
          else
            cp dist/graphify target/release/graphify
            chmod +x target/release/graphify
          fi
      - run: cargo build --release -p rtk
      - run: cargo build --release -p cotrex
      - name: Package cotrex
        shell: bash
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          NAME="${{ matrix.name }}"
          rm -rf dist
          mkdir dist

          # Copy release artifacts
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/cotrex.exe dist/
          else
            cp target/release/cotrex dist/
          fi

          # Copy documentation
          cp README.md dist/ 2>/dev/null || true
          cp LICENSE dist/ 2>/dev/null || true
          cp CHANGELOG.md dist/ 2>/dev/null || true

          # Create archive
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "dist/cotrex-${VER}-${NAME}.zip" dist/cotrex.exe dist/README.md dist/LICENSE dist/CHANGELOG.md
          else
            tar czf "dist/cotrex-${VER}-${NAME}.tar.gz" -C dist cotrex README.md LICENSE CHANGELOG.md
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER="${{ github.ref_name }}"; VER="${VER#v}"
          gh release create "${{ github.ref_name }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Release v${VER}" \
            --generate-notes
